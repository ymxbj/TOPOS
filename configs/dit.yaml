SOLVER:
    run: train
    max_epoch: 1000
    log_per_iter: 10
    type: adamw
    weight_decay: 0.01
    lr: 0.0001
    lr_type: poly
    lr_power: 0.9
    logdir: logs/dit

DATA:
    train:
        depth: &depth 8
        edge_file: &edge_file ./data/edges.npy
        cluster_file: &cluster_file ./data/cluster.npz
        template_vertices_path: &template_vertices ./data/template_vertices.npz
        root_dir: ./
        use_surface: True
        use_images: True
        max_rotation: 5.0
        max_translate: 0.1
        scale_range: [0.85, 1.05]
        image_nums: 8
        filelist: filelists/train.txt
        batch_size: 8
        shuffle: True
        num_workers: 4

    # Inference-time settings — no filelist; the template HGraph is rebuilt
    # from the topology assets below and combined with images supplied via
    # `test_image_path` / `test_image_dir` in the corresponding override config.
    test:
        depth: *depth
        edge_file: *edge_file
        cluster_file: *cluster_file
        template_vertices_path: *template_vertices

MODEL:
    base_mesh: ./data/template.obj
    compile: True

    # TOPOS-VAE shape (must match the trained VAE checkpoint)
    vae_out_channel: 6
    code_channel: &code_channel 32
    num_latents: 1513
    width: 128
    num_encoder_layers: 8
    point_feats: 3
    num_freqs: 8
    include_pi: False
    decoder_blocks: [4, 4, 3, 3]
    decoder_channel: [512, 512, 256, 256, 128]
    vae_ckpt: ./pretrained_ckpt/TOPOS-VAE.model.pth

    # TOPOS-DiT shape
    df_in_channels: *code_channel
    df_out_channels: *code_channel
    cond_channels: 1024
    model_channels: 1024
    num_blocks: 24
    num_heads: 16
    num_head_channels: 64
    mlp_ratio: 4
    pe_mode: ape
    qk_rms_norm: True
    use_fp16: False
    use_checkpoint: False
    p_uncond: 0.1

    # Image encoder (see README for download instructions)
    image_cond_model_name: dinov2_vitl14_reg
    image_cond_model_dir: ./pretrained_ckpt/facebookresearch_dinov2_main
    image_cond_model_path: ./pretrained_ckpt/dinov2_vitl14_reg4_pretrain.pth

    # Sampling
    cfg_strength: 3.0
    sample_steps: 50
